name: Sync trophy images
on:
  push:
    branches: [main]
    paths:
      - 'public/assets/trophies/**'
      - 'scripts/sync-trophy-images.mjs'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Rebuild image catalog
        run: node scripts/sync-trophy-images.mjs
      - name: Commit catalog when updated
        run: |
          if ! git diff --quiet -- public/trophy-images.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add public/trophy-images.json
            git commit -m "chore: refresh trophy image map"
            git push
          elif [ ! -f public/trophy-images.json ]; then
            git add public/trophy-images.json
            git commit -m "chore: initialize trophy image map"
            git push
          fi
