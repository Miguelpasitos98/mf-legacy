name: Historical possession pipeline tests

on:
  pull_request:
    paths:
      - "scripts/possession/**"
      - ".github/workflows/historical-possession-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline converter and coverage tests
        run: python -m unittest discover -s scripts/possession -p "test_*.py" -v
