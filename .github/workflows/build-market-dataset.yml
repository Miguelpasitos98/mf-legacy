name: Build historical market dataset
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/build_market_dataset.py
      - .github/workflows/build-market-dataset.yml
permissions:
  contents: write
jobs:
  build-market:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download and process public snapshot
        run: python scripts/build_market_dataset.py
      - name: Commit generated data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/market/
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh indexed Transfermarkt valuation snapshot"
            git push
          fi
