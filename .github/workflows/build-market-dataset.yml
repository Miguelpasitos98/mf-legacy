name: Build historical market dataset
on:
  workflow_dispatch:
  push:
    paths:
      - data/market-index-upload.zip
      - scripts/build_market_dataset.py
      - .github/workflows/build-market-dataset.yml
permissions:
  contents: write
jobs:
  build-market:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare published index from uploaded ZIP
        run: |
          python - <<'PY'
          import zipfile, json
          from pathlib import Path
          source = Path("data/market-index-upload.zip")
          if not source.is_file():
              raise SystemExit("Sube primero el archivo ZIP a data/market-index-upload.zip. No se realizan descargas externas.")
          target = Path("public/data/market")
          target.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(source) as zipped:
              files = {p for p in zipped.namelist() if p.startswith("public/data/market/")}
              if "public/data/market/manifest.json" not in files or "public/data/market/players-index.json" not in files:
                  raise SystemExit("El ZIP no tiene la estructura del índice MF Legacy")
              for i in range(128):
                  expected = f"public/data/market/valuations-{i:03d}.json"
                  if expected not in files:
                      raise SystemExit(f"Falta {expected}")
              for name in files:
                  if not name.endswith(".json"):
                      continue
                  destination = target / Path(name).name
                  destination.write_bytes(zipped.read(name))
          manifest = json.loads((target / "manifest.json").read_text())
          assert manifest["players"] > 0 and manifest["valuations"] > 0
          print(manifest)
          PY
      - name: Publish generated dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/market/
          if ! git diff --cached --quiet; then
            git commit -m "data: publish validated local market history index"
            git push
          fi
